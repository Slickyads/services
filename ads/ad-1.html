<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ad Creative 1</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            width: 1200px;
            height: 628px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
        }
        .logo {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .logo img {
            width: 60px;
            height: 60px;
        }
        h1 {
            font-size: 3.5rem;
            color: white;
            margin-bottom: 20px;
            font-weight: 800;
        }
        p {
            font-size: 1.8rem;
            color: rgba(255,255,255,0.95);
            margin-bottom: 40px;
            max-width: 800px;
            line-height: 1.4;
        }
        .cta {
            background: #25D366;
            color: white;
            padding: 18px 50px;
            border-radius: 50px;
            font-size: 1.4rem;
            font-weight: 700;
            box-shadow: 0 4px 20px rgba(37,211,102,0.4);
        }
        .services {
            display: flex;
            gap: 30px;
            margin-top: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .service-tag {
            background: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 25px;
            color: white;
            font-size: 1rem;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="https://services.slickymedia.com/assets/images/slickyads_logo.png" alt="Slicky Media">
        </div>
        <h1>Scale Your Business With<br>Performance Marketing</h1>
        <p>Google Ads · Meta Ads · SEO · eCommerce Growth</p>
        <div class="cta">Get Your Free Strategy Call →</div>
        <div class="services">
            <span class="service-tag">Google Ads</span>
            <span class="service-tag">Meta Ads</span>
            <span class="service-tag">SEO</span>
            <span class="service-tag">MarTech</span>
        </div>
    </div>
</body>
</html>
