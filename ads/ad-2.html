<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ad Creative 2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            width: 1200px;
            height: 628px;
            background: #0a0a0a;
            display: flex;
            overflow: hidden;
        }
        .left {
            width: 55%;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }
        .right {
            width: 45%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .badge {
            background: #25D366;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 20px;
            width: fit-content;
        }
        h1 {
            font-size: 2.8rem;
            color: white;
            margin-bottom: 20px;
            line-height: 1.2;
        }
        .highlight {
            color: #25D366;
        }
        p {
            font-size: 1.1rem;
            color: rgba(255,255,255,0.7);
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .cta {
            background: #25D366;
            color: white;
            padding: 16px 40px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            display: inline-block;
            text-decoration: none;
            width: fit-content;
        }
        .services-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }
        .service {
            background: rgba(255,255,255,0.1);
            padding: 8px 16px;
            border-radius: 6px;
            color: rgba(255,255,255,0.8);
            font-size: 0.9rem;
        }
        .stats {
            display: flex;
            gap: 30px;
            margin-top: 30px;
        }
        .stat {
            text-align: center;
        }
        .stat-number {
            font-size: 2rem;
            font-weight: 800;
            color: #25D366;
        }
        .stat-label {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.6);
            margin-top: 4px;
        }
        .phone-icon {
            width: 300px;
            height: 400px;
        }
    </style>
</head>
<body>
    <div class="left">
        <span class="badge">Free Strategy Session</span>
        <h1>Stop Wasting Money on<br><span class="highlight">Bad Ads</span></h1>
        <p>Get a complete audit of your Google & Meta campaigns. We'll identify what's costing you money and how to fix it.</p>
        <div class="cta">Book Your Free Call →</div>
        <div class="services-list">
            <span class="service">Google Ads</span>
            <span class="service">Meta Ads</span>
            <span class="service">SEO</span>
            <span class="service">Shopify</span>
        </div>
        <div class="stats">
            <div class="stat">
                <div class="stat-number">10%+</div>
                <div class="stat-label">Avg. ROAS</div>
            </div>
            <div class="stat">
                <div class="stat-number">50+</div>
                <div class="stat-label">Clients</div>
            </div>
        </div>
    </div>
    <div class="right">
        <svg class="phone-icon" viewBox="0 0 300 400" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="40" y="20" width="220" height="360" rx="30" fill="white" stroke="rgba(255,255,255,0.3)" stroke-width="4"/>
            <rect x="55" y="50" width="190" height="300" rx="5" fill="#1a1a2e"/>
            <circle cx="150" cy="375" r="15" fill="rgba(255,255,255,0.3)"/>
            <rect x="100" y="35" width="100" height="8" rx="4" fill="rgba(0,0,0,0.2)"/>
            <rect x="90" y="80" width="120" height="240" rx="10" fill="white"/>
            <text x="150" y="160" text-anchor="middle" fill="#667eea" font-size="14" font-weight="bold">Book Your</text>
            <text x="150" y="185" text-anchor="middle" fill="#667eea" font-size="14" font-weight="bold">Free Call</text>
            <rect x="100" y="210" width="100" height="30" rx="5" fill="#25D366"/>
            <text x="150" y="230" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Book Now →</text>
        </svg>
    </div>
</body>
</html>
