<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Education Services</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 60px 20px;
        }
        .audit-section {
            max-width: 500px;
            margin: 0 auto;
            text-align: center;
        }
        .audit-section h2 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: #ffffff;
        }
        .audit-section > p {
            color: rgba(255,255,255,0.9);
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .audit-form {
            padding: 30px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
            background-color: #fff;
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #25D366;
        }
        .btn-whatsapp {
            width: 100%;
            padding: 16px 24px;
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-whatsapp:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
        }
        .form-note {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #6c757d;
        }
        .form-highlight {
            margin-top: 30px;
        }
        .form-highlight p {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-58ZPXKF"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <section class="audit-section">
        <h2>Start With a Free Account Review</h2>
        <p>Tell us what you need. We'll come back with specific recommendations.</p>

        <form class="audit-form" action="#" method="POST">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" required>
            </div>

            <div class="form-group">
                <label for="service">Service Needed</label>
                <select id="service" name="service" required>
                    <option value="" disabled selected>Select a service</option>
                    <option value="google-ads">Google Ads Management</option>
                    <option value="meta-ads">Meta Ads (Facebook & Instagram)</option>
                    <option value="seo">SEO Services</option>
                    <option value="ecommerce">eCommerce / Shopify Growth</option>
                    <option value="martech">MarTech & Automation</option>
                    <option value="project">Digital Project / Traffic Management</option>
                    <option value="not-sure">Not sure yet</option>
                </select>
            </div>

            <div class="form-group">
                <label for="budget">Monthly Ad Spend (AED)</label>
                <select id="budget" name="budget">
                    <option value="" disabled selected>Select range</option>
                    <option value="not-running">Not running ads yet</option>
                    <option value="5000-15000">AED 5,000 – 15,000</option>
                    <option value="15000-30000">AED 15,000 – 30,000</option>
                    <option value="30000-75000">AED 30,000 – 75,000</option>
                    <option value="75000+">AED 75,000+</option>
                </select>
            </div>

            <button type="submit" class="btn-whatsapp">
                Send via WhatsApp →
            </button>

            <p class="form-note">Goes directly to Slicky Media. No middlemen. Replies same day.</p>
        </form>

        <div class="form-highlight">
            <p>Free Consultation · No Obligation</p>
        </div>
    </section>
</body>
</html>
